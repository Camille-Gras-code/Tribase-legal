<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adresse confirmée — TriBase</title>
<style>
:root{--bg:#ffffff;--fg:#1c1c1e;--mid:#6b7280;--card:#f6f6f7;--accent:#f97316}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--fg:#f3f4f6;--mid:#9ca3af;--card:#161a22}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.card{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:36px 28px;text-align:center}
.logo{font-size:1.9rem;font-weight:800;letter-spacing:-.5px;margin:0 0 20px}
.logo span{color:var(--accent)}
.check{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;line-height:64px;margin:0 auto 18px}
h1{font-size:1.4rem;margin:0 0 10px}
p{color:var(--mid);margin:0 0 22px}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:999px}
small{display:block;margin-top:18px;color:var(--mid);font-size:.85rem}
</style>
</head>
<body>
<main class="card">
  <div class="logo">Tri<span>Base</span></div>
  <div class="check">✓</div>
  <h1>Adresse e-mail confirmée</h1>
  <p>Ton compte est activé. Tu peux retourner dans l'application TriBase : elle te connecte automatiquement.</p>
  <a class="btn" href="tribase://">Ouvrir TriBase</a>
  <small>Si le bouton ne fait rien, ferme cette page et ouvre l'application TriBase directement.</small>
</main>
</body>
</html>
